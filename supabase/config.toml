project_id = "solar-management-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

# Catches every outbound mail locally (invites, password resets, email-change confirmations)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/reset-password",
  "http://localhost:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "abd.srour313@gmail.com"
pass = "boopxbjpiueossws"
admin_email = "abd.srour313@gmail.com"
sender_name = "Solar Management System"

[auth.email.template.invite]
subject = "Welcome to Solar Management System — Set Your Password"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset Your Password — Solar Management System"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm Your New Email Address — Solar Management System"
content_path = "./supabase/templates/email-change.html"

# Puts `role`, `tenant_id`, `app_role` and `permissions` into every access token.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"