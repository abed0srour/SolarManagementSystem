name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ staging, main ]
  push:
    branches: [ staging, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm run test -- --passWithNoTests

  frontend-ci:
    name: Frontend Typecheck & Build Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://ci-mock-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-mock-anon-key-placeholder-for-build-verification
          API_URL: https://ci-api-mock.example.com
        run: npm run build
